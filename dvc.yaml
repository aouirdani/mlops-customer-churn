stages:
  train:
    cmd: uv run python src/mlops_customer_churn/train.py
    deps:
    - data/raw/Telco-Customer-Churn.csv
    - src/mlops_customer_churn/train.py
    outs:
    - models/churn_model.joblib
    metrics:
    - reports/metrics.json
  compare:
    cmd: uv run python src/mlops_customer_churn/compare_models.py
    deps:
    - data/raw/Telco-Customer-Churn.csv
    - src/mlops_customer_churn/compare_models.py
    metrics:
    - reports/model_comparison.json
  tune:
    cmd: uv run python src/mlops_customer_churn/tune.py
    deps:
    - data/raw/Telco-Customer-Churn.csv
    - src/mlops_customer_churn/tune.py
    metrics:
    - reports/tuning_results.json
  evaluate:
    cmd: uv run python src/mlops_customer_churn/evaluate.py
    deps:
    - data/raw/Telco-Customer-Churn.csv
    - models/churn_model.joblib
    - reports/tuning_results.json
    - src/mlops_customer_churn/evaluate.py
    metrics:
    - reports/final_evaluation.json
